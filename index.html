<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="description" content="Cycling minigames for your smart trainer and heart rate strap.">
<title>Pedal Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>

<!-- top bar: game picker (hidden while playing) -->
<header class="topbar">
  <div class="topbar-row">
    <span class="brand">🚴 Pedal Quest</span>
    <span id="version">build 18 · 2026-11-01 13:02</span>
  </div>
  <nav id="game-nav" aria-label="games"></nav>
</header>

<!-- setup screen: sensors, profile, selected game's rules and options -->
<section id="screen-setup" class="screen active">
  <div class="panel">
    <div class="row"><button id="btn-trainer">Connect trainer</button><span id="st-trainer" class="st">not connected</span></div>
    <div class="row"><button id="btn-hr" class="secondary">Connect HR strap</button><span id="st-hr" class="st">optional</span></div>
    <p id="ble-warning" class="warn hidden">This browser has no Web Bluetooth. Use Chrome on Android or PC. Demo mode still works.</p>
    <div class="profile">
      <label>FTP <input type="number" id="p-ftp" inputmode="numeric" min="60" max="600"> W</label>
      <label>Max HR <input type="number" id="p-maxhr" inputmode="numeric" min="120" max="220"> bpm</label>
      <label>Weight <input type="number" id="p-weight" inputmode="numeric" min="35" max="150"> kg</label>
      <label class="toggle"><input type="checkbox" id="p-sound"> Sounds</label>
    </div>
    <p id="lifetime" class="small lifetime"></p>
  </div>

  <div class="panel daily" id="daily"></div>

  <div class="game-head">
    <h1 id="g-title"></h1>
    <p id="g-tagline" class="tag"></p>
    <div id="g-needs" class="chips"></div>
  </div>
  <div class="panel"><div class="label">How to play</div><ul id="g-how" class="how"></ul></div>
  <div class="panel" id="g-options"></div>

  <button id="btn-start" class="big">Start</button>
  <p class="small" id="mode-note"></p>

  <div class="panel"><div class="label" id="g-board-label">Top scores</div><ol id="g-board" class="board"></ol></div>
  <details class="panel badges" id="history"></details>
  <details class="panel badges" id="badges"></details>
  <p class="small"><a href="test.html">Connection test page</a></p>
</section>

<!-- play screen shared by all games: canvas + game hud + shared metrics -->
<section id="screen-play" class="screen">
  <div id="canvas-slot"></div>
  <div id="overlay" class="overlay"></div>
  <div id="play-top" class="play-top">
    <div id="game-hud" class="game-hud"></div>
    <button id="btn-pause" class="quit" aria-label="pause">⏸</button>
    <button id="btn-quit" class="quit" aria-label="quit">✕</button>
  </div>
  <div id="hud-bottom" class="hud-bottom">
    <div id="demo" class="demo hidden">
      <label id="demo-w">W <input type="range" id="in-watts" min="0" max="900" step="5" value="0"></label>
      <label id="demo-rpm">rpm <input type="range" id="in-rpm" min="0" max="140" step="1" value="85"></label>
      <label id="demo-hr">HR <input type="range" id="in-hr" min="60" max="200" step="1" value="100"></label>
    </div>
    <div id="game-bottom"></div>
    <div class="metrics">
      <div class="m main"><span id="m-watts">0</span><small>W</small></div>
      <div class="m"><span id="m-speed">--</span><small>km/h</small></div>
      <div class="m"><span id="m-cad">0</span><small>rpm</small></div>
      <div class="m"><span id="m-hr">--</span><small>bpm</small></div>
    </div>
  </div>
  <div id="banner" class="banner hidden"></div>
  <div id="countdown" class="countdown hidden"></div>
</section>

<!-- results screen -->
<section id="screen-results" class="screen">
  <h1 id="r-title"></h1>
  <p id="r-sub" class="tag"></p>
  <div id="r-body"></div>
  <div id="r-daily"></div>
  <div id="r-badges"></div>
  <div id="r-ride"></div>
  <div class="panel"><div class="label" id="r-board-label"></div><ol id="r-board" class="board"></ol></div>
  <button id="btn-again" class="big">Play again</button>
  <button id="btn-share" class="secondary wide">Share result</button>
  <button id="btn-export" class="secondary wide">Download ride (.tcx for Strava)</button>
  <button id="btn-setup" class="secondary wide">Back to setup</button>
</section>

<!-- three.js for the 3d race (same version as other projects) -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/main.js?v=18"></script>
</body>
</html>
