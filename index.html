<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="description" content="Cycling minigames for your smart trainer and heart rate strap.">
<title>Pedal Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<link rel="stylesheet" href="style.css?v=42">
</head>
<body>

<!-- the game world behind the menus (js/menu3d.js) -->
<div id="menu-bg" class="menu-bg" aria-hidden="true"></div>

<!-- top bar: game picker (hidden while playing) -->
<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg class="brand-wheel" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="4"/>
        <path d="M20 5v30M5 20h30M9.4 9.4l21.2 21.2M30.6 9.4L9.4 30.6" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="3.5" fill="currentColor"/>
      </svg>
      <div><div class="brand-name">Pedal <span>Quest</span></div><span id="version">build 42 · 2026-11-02 13:01</span></div>
    </div>
    <div id="menu-icons" class="menu-icons"></div>
  </div>
  <nav id="game-nav" aria-label="games"></nav>
</header>

<!-- rider bar: set up once for every game (name, sync, trainer + hr strap, rider details) -->
<details id="rider" class="rider">
  <summary id="rider-sum"></summary>
  <div class="rider-body">
    <div class="row player-row">
      <label class="small" for="player-name">Player name</label><input id="player-name" maxlength="24" autocomplete="nickname">
      <button id="sync" class="sync-btn" hidden></button>
    </div>
    <div class="row"><button id="btn-trainer">Connect trainer</button><span id="st-trainer" class="st">not connected</span></div>
    <div class="row"><button id="btn-hr" class="secondary">Connect HR strap</button><span id="st-hr" class="st">optional</span></div>
    <p id="ble-warning" class="warn hidden">This browser has no Web Bluetooth. Use Chrome on Android or PC. Demo mode still works.</p>
    <div class="profile">
      <label>FTP <input type="number" id="p-ftp" inputmode="numeric" min="60" max="600"> W</label>
      <label>Max HR <input type="number" id="p-maxhr" inputmode="numeric" min="120" max="220"> bpm</label>
      <label>Weight <input type="number" id="p-weight" inputmode="numeric" min="35" max="150"> kg</label>
      <label class="toggle"><input type="checkbox" id="p-sound"> Sounds</label>
      <label class="toggle"><input type="checkbox" id="p-music"> Music</label>
      <label class="toggle"><input type="checkbox" id="p-comm"> Commentator</label>
      <label class="track">Voice <select id="p-voice"></select> <button id="p-voice-test" class="secondary" type="button">▶ Test</button></label>
      <label class="track">Track <select id="p-track"></select></label>
    </div>
  </div>
</details>

<!-- setup screen: the selected game's rules and options -->
<section id="screen-setup" class="screen active">

  <div class="panel daily" id="daily"></div>

  <div class="game-head">
    <h1 id="g-title"></h1>
    <p id="g-tagline" class="tag"></p>
    <div id="g-needs" class="chips"></div>
  </div>
  <details class="panel how-box"><summary><span class="opt-ic">❓</span>How to play</summary><ul id="g-how" class="how"></ul></details>
  <div id="g-options" class="opts"></div>

  <button id="btn-start" class="big">Start</button>

  <div class="panel board-panel"><div class="opt-head"><span class="opt-ic">🏆</span><span id="g-board-label">Top scores</span></div><ol id="g-board" class="board"></ol></div>
</section>

<!-- garage: level + pp, the cyclist on a turntable, unlockable look -->
<section id="screen-garage" class="screen">
  <div class="panel pp" id="garage-level"></div>
  <canvas id="garage-canvas" class="garage-canvas"></canvas>
  <div class="panel" id="garage-slots"></div>
</section>

<!-- stats tab: totals, records, best result per game, ride history, badges -->
<section id="screen-stats" class="screen">
  <div id="stats-body"></div>
  <details class="panel badges" id="history"></details>
  <details class="panel badges" id="badges"></details>
</section>

<!-- play screen shared by all games: canvas + game hud + shared metrics -->
<section id="screen-play" class="screen">
  <div id="canvas-slot"></div>
  <div id="overlay" class="overlay"></div>
  <div id="play-top" class="play-top">
    <div id="game-hud" class="game-hud"></div>
    <button id="btn-song" class="quit" aria-label="next song">♪</button>
    <button id="btn-pause" class="quit" aria-label="pause">⏸</button>
    <button id="btn-quit" class="quit" aria-label="quit">✕</button>
  </div>
  <div id="hud-bottom" class="hud-bottom">
    <div id="demo" class="demo hidden">
      <label id="demo-w">W <input type="range" id="in-watts" min="0" max="900" step="5" value="0"></label>
      <label id="demo-rpm">rpm <input type="range" id="in-rpm" min="0" max="140" step="1" value="85"></label>
      <label id="demo-hr">HR <input type="range" id="in-hr" min="60" max="200" step="1" value="100"></label>
    </div>
    <div id="game-bottom"></div>
    <div class="metrics">
      <div class="m main"><span id="m-watts">0</span><small>W</small></div>
      <div class="m"><span id="m-speed">--</span><small>km/h</small></div>
      <div class="m"><span id="m-cad">0</span><small>rpm</small></div>
      <div class="m"><span id="m-hr">--</span><small>bpm</small></div>
    </div>
  </div>
  <div id="banner" class="banner hidden"></div>
  <div id="countdown" class="countdown hidden"></div>
</section>

<!-- results screen -->
<section id="screen-results" class="screen">
  <h1 id="r-title"></h1>
  <p id="r-sub" class="tag"></p>
  <div id="r-body"></div>
  <div id="r-pp"></div>
  <div id="r-daily"></div>
  <div id="r-badges"></div>
  <div id="r-ride"></div>
  <div class="panel"><div class="label" id="r-board-label"></div><ol id="r-board" class="board"></ol></div>
  <button id="btn-again" class="big">Play again</button>
  <button id="btn-share" class="secondary wide">Share result</button>
  <button id="btn-export" class="secondary wide">Download ride (.tcx for Strava)</button>
  <button id="btn-setup" class="secondary wide">Back to setup</button>
</section>

<!-- three.js for the 3d race (same version as other projects) -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/main.js?v=42"></script>
</body>
</html>
